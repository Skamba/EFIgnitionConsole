[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino

; MCP2515 driver for the CAN module. Fetched automatically on the first build.
; The LCD library is not listed here: a trimmed copy lives in lib/NewLiquidCrystal.
lib_deps =
    https://github.com/coryjfowler/MCP_CAN_lib.git
